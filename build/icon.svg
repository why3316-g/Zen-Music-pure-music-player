<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2a2118"/>
      <stop offset="100%" stop-color="#1a1410"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4b896" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d4b896" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8a87a"/>
      <stop offset="100%" stop-color="#a08060"/>
    </linearGradient>
  </defs>
  <!-- Round background -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="url(#glow)"/>
  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#c8a87a" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#c8a87a" stroke-width="0.5" stroke-opacity="0.1"/>
  <!-- Zen music note: a single elegant quaver -->
  <g transform="translate(256,256)">
    <!-- Note head (ellipse, tilted) -->
    <ellipse cx="-20" cy="60" rx="42" ry="30" fill="url(#noteGrad)" transform="rotate(-20,-20,60)"/>
    <!-- Stem -->
    <rect x="18" y="-90" width="5" height="155" rx="2.5" fill="url(#noteGrad)"/>
    <!-- Flag (elegant curve) -->
    <path d="M23,-90 C23,-90 70,-70 65,-30 C60,5 35,15 23,-10" fill="none" stroke="url(#noteGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- Enso circle (禅圆) - partial, brushstroke style -->
  <path d="M 256 80 A 176 176 0 1 1 254 80" fill="none" stroke="#c8a87a" stroke-width="3" stroke-opacity="0.25" stroke-linecap="round"/>
</svg>
